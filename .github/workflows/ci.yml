name: CI

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test_go:
    name: Go tests
    runs-on: ubuntu-latest
    env:
        PROMU: ./promu-intermediate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - run: go build -o promu-intermediate
      - run: make check_license style unused lint test build GO_ONLY=1 SKIP_GOLANGCI_LINT=1
      - run: rm -v promu promu-intermediate
      - run: git diff --exit-code

  build:
    name: Build for common architectures
    runs-on: ubuntu-latest
    env:
        PROMU: ./promu-intermediate
    strategy:
      matrix:
        thread: [ 0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - run: go build -o promu-intermediate
      - run: ./promu-intermediate crossbuild -v --parallelism 4 --parallelism-thread ${{ matrix.thread }}
      - uses: prometheus/promci-artifacts/save@9ca3252d07f230d5f923452b4df5697eba4a5bee # v0.1.1

  publish_release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [test_go, build]
    if: |
      (github.repository == 'prometheus/promu')
      &&
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: prometheus/promci/publish_release@872d318d090d73df349cb6ed90aadd072ca478f7 # v0.10.0
        with:
          github_token: ${{ github.token }}
